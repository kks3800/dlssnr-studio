# Source manifest.
#
# One [[source]] block per clip. `rights` must be one of:
#
#   own-capture     footage you captured yourself
#   licensed        written licence or press-kit terms permitting redistribution
#   dev-supplied    the developer/publisher gave it to you for this
#   public-domain   out of copyright
#   cc              Creative Commons (attribution required)
#
# The pipeline refuses anything else. That is deliberate: it keeps footage you
# have no right to republish out of the queue.

